name: Secret scan

# gitleaks over the full history on every push and pull request. The CLI image
# is used directly: gitleaks-action requires a paid licence key on private
# repositories, the binary does not.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --no-banner --redact --verbose
